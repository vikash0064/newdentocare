  <!-- Smart Elfsight Defer: Loads only when user scrolls or after long idle -->
  <script>
    (function () {
      let scriptLoaded = false;
      const loadScript = () => {
        if (scriptLoaded) return;
        scriptLoaded = true;
        const s = document.createElement('script');
        s.src = "https://elfsightcdn.com/platform.js";
        s.defer = true;
        document.head.appendChild(s);
      };

      // 1. Load on interaction with passive listeners for better score
      window.addEventListener('scroll', loadScript, { once: true, passive: true });
      window.addEventListener('mousemove', loadScript, { once: true, passive: true });
      window.addEventListener('touchstart', loadScript, { once: true, passive: true });

      // 2. Load on idle (if no interaction)
      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => setTimeout(loadScript, 10000));
      } else {
        setTimeout(loadScript, 15000);
      }
    })();
  </script>
